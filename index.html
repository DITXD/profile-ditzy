  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #030308; }
    ::-webkit-scrollbar-thumb { background: #ff003c; border-radius: 3px; }

    /* Animated Grid Background */
    .cyber-bg {
      background-color: #030308;
      background-image: 
        radial-gradient(circle at 15% 30%, rgba(255, 0, 60, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 85% 70%, rgba(0, 240, 255, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 60%),
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 35px 35px, 35px 35px;
    }

    /* Glitch Text Effect */
    .glitch-text {
      position: relative;
      display: inline-block;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 0, 60, 0.9), 0 0 30px rgba(255, 0, 60, 0.5);
    }
    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      clip: rect(0, 0, 0, 0);
    }
    .glitch-text::before {
      left: 2px;
      text-shadow: -2px 0 #00f0ff;
      animation: glitch-anim-1 2.2s infinite linear alternate-reverse;
    }
    .glitch-text::after {
      left: -2px;
      text-shadow: -2px 0 #ff0050;
      animation: glitch-anim-2 2.8s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim-1 {
      0% { clip: rect(15px, 9999px, 10px, 0); }
      20% { clip: rect(45px, 9999px, 75px, 0); }
      40% { clip: rect(5px, 9999px, 35px, 0); }
      60% { clip: rect(65px, 9999px, 25px, 0); }
      80% { clip: rect(25px, 9999px, 55px, 0); }
      100% { clip: rect(55px, 9999px, 5px, 0); }
    }
    @keyframes glitch-anim-2 {
      0% { clip: rect(35px, 9999px, 5px, 0); }
      25% { clip: rect(5px, 9999px, 55px, 0); }
      50% { clip: rect(75px, 9999px, 15px, 0); }
      75% { clip: rect(25px, 9999px, 65px, 0); }
      100% { clip: rect(45px, 9999px, 25px, 0); }
    }

    /* Scanline overlay */
    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.35) 50%,
        rgba(0, 0, 0, 0.35)
      );
      background-size: 100% 4px;
    }

    /* Hover Sweep Glass Effect */
    .shimmer-btn {
      position: relative;
      overflow: hidden;
    }
    .shimmer-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 30%,
        rgba(255, 255, 255, 0.2) 50%,
        transparent 70%
      );
      transform: rotate(30deg) translateX(-100%);
      transition: transform 0.7s ease-out;
    }
    .shimmer-btn:hover::after {
      transform: rotate(30deg) translateX(100%);
    }

    /* Custom Glowing Cursor */
    .custom-cursor {
      pointer-events: none;
      position: fixed;
      width: 22px;
      height: 22px;
      border: 2px solid #ff003c;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, background-color 0.2s, border-color 0.2s;
      z-index: 9999;
      box-shadow: 0 0 15px #ff003c;
    }
    .custom-cursor-dot {
      pointer-events: none;
      position: fixed;
      width: 6px;
      height: 6px;
      background: #00f0ff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 10000;
    }

    /* Glowing Animated Card Border */
    .hologram-border {
      position: relative;
    }
    .hologram-border::before {
      content: '';
      position: absolute;
      inset: -1px;
      background: linear-gradient(90deg, #ff003c, #8b5cf6, #00f0ff, #ff003c);
      background-size: 300% 300%;
      border-radius: 1.5rem;
      z-index: -1;
      animation: animatedGlow 6s linear infinite;
      opacity: 0.6;
    }
    @keyframes animatedGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

  <script>
    // Live Clock
    function updateClock() {
      const now = new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').innerText = `${hrs}:${mins}:${secs} LOCAL`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Copy Link functionality
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');
    
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href);
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    });

    // Custom glowing cursor movement
    const cursor = document.getElementById('cursor');
    const cursorDot = document.getElementById('cursor-dot');

    window.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
      cursorDot.style.left = e.clientX + 'px';
      cursorDot.style.top = e.clientY + 'px';
    });

    // Hover effect on cursor for interactive elements
    document.querySelectorAll('a, button, [data-tilt]').forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursor.style.width = '45px';
        cursor.style.height = '45px';
        cursor.style.backgroundColor = 'rgba(255, 0, 60, 0.15)';
        cursor.style.borderColor = '#00f0ff';
      });
      el.addEventListener('mouseleave', () => {
        cursor.style.width = '22px';
        cursor.style.height = '22px';
        cursor.style.backgroundColor = 'transparent';
        cursor.style.borderColor = '#ff003c';
      });
    });

    // Particle Background Canvas
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const particles = [];
    const particleCount = 45;

    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.8,
        vy: (Math.random() - 0.5) * 0.8,
        size: Math.random() * 2 + 1,
        color: Math.random() > 0.5 ? '#ff003c' : '#00f0ff'
      });
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();

        for (let j = index + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dist = Math.hypot(p.x - p2.x, p.y - p2.y);

          if (dist < 120) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 - dist / 1200})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      });

      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
